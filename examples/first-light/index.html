<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First Light — X Motion</title><style>html,body{margin:0;background:#07090c;width:100%;height:100%;overflow:hidden}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,177.7778vh);height:auto;aspect-ratio:16/9}</style></head><body><canvas width="960" height="540" aria-label="First Light. A titanium aperture turns into inspection light, resolving into the original X Motion wordmark."></canvas><script>
'use strict';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d',{alpha:false});

// Original single-line geometric letterforms; no platform-dependent hero font.

function rot([x,y,z]){let X=x*cs-y*ss,Y=x*ss+y*cs;let yy=Y*co-z*sx,zz=Y*sx+z*co;return[X*cyaw+zz*sy,yy,-X*sy+zz*cyaw]}

c.save();c.globalAlpha=arrival*(1-ease((t-3.35)/.67));

const lightAngle=-2.4+2.9*ease((t-.3)/2.5),L=[Math.cos(lightAngle)*.75,Math.sin(lightAngle)*.65,.62],len=Math.hypot(...L);L.forEach((v,i)=>L[i]=v/len);
function face(v,n,variation=0){const q=v.map(p),normal=rot(n),diff=Math.max(0,normal.reduce((s,v,i)=>s+v*L[i],0)),spec=Math.pow(Math.max(0,normal[0]*L[0]*.5+normal[1]*L[1]*.5+normal[2]*.9),28),base=20+diff*94+spec*150+variation;faces.push({q,z:q.reduce((s,v)=>s+v[2],0)/q.length,color:`rgb(${Math.min(245,base*1.04+spec*18)},${Math.min(240,base*1.02+spec*8)},${Math.min(235,base+7)})`})}
for(let i=0;i<192;i++){const a=i/192*TAU,b=(i+1)/192*TAU,mid=(a+b)/2;for(let j=0;j<profile.length;j++){const [r,z]=profile[j],[r2,z2]=profile[(j+1)%profile.length],dr=r2-r,dz=z2-z,ll=Math.hypot(dr,dz);face([[r*Math.cos(a),r*Math.sin(a),z],[r*Math.cos(b),r*Math.sin(b),z],[r2*Math.cos(b),r2*Math.sin(b),z2],[r2*Math.cos(a),r2*Math.sin(a),z2]],[-dz/ll*Math.cos(mid),-dz/ll*Math.sin(mid),dr/ll],Math.sin(i*2.39)*1.4)}}

faces.sort((a,b)=>a.z-b.z);for(const f of faces)poly(f.q,f.color);
// Concentric tool paths and etched index marks follow the same camera projection.

for(let i=0;i<60;i++){const a=i/60*TAU,r=i%5===0?173:179;line([p([r*Math.cos(a),r*Math.sin(a),17.3]),p([183*Math.cos(a),183*Math.sin(a),17.3])],'rgba(238,229,206,.35)',i%5===0?1:.6)}
for(let i=0;i<8;i++){const a=i*TAU/8+.15*ease(t/3),b=a+TAU/8;line([p([145*Math.cos(b),145*Math.sin(b),.4]),p([aperture*Math.cos(b+.43),aperture*Math.sin(b+.43),.4])],'rgba(175,184,192,.24)',.65)}

// Optical cross becomes the identity; no unrelated logo drop-in.
const birth=ease((t-2.25)/.8),solid=ease((t-3.05)/.95),alpha=birth;const size=mix(18,34,solid),x=mix(480,261,resolve);c.save();c.globalAlpha=alpha;glow(x,258,90,(1-solid)*.55);const col=solid>.98?'#e6e4db':`rgb(242,${mix(215,228,solid)},${mix(172,219,solid)})`;line([[x-size,258-size],[x+size,258+size]],col,mix(1.2,7,solid));line([[x-size,258+size],[x+size,258-size]],col,mix(1.2,7,solid));c.restore();}
window.renderFrame=async function(seconds){const t=Math.max(0,Math.min(6,Number.isFinite(seconds)?seconds:0));// Reset the complete drawing state, clip stack and current path before every seek.
if(typeof c.reset==='function')c.reset();else canvas.width=960;
c.fillStyle='#07090c';c.fillRect(0,0,960,540);
const bg=c.createRadialGradient(480,250,15,480,250,440);bg.addColorStop(0,'#10151b');bg.addColorStop(1,'#07090c');c.fillStyle=bg;c.fillRect(0,0,960,540);
const tech=ease(t/.65)*(1-ease((t-2.7)/.7));c.save();c.globalAlpha=tech;label('FIRST LIGHT',55,58,3,'#b9b2a4');label('APERTURE STUDY / 001',55,484,1.6,'#777f88',8);label('X / MOTION',779,484,1.6,'#777f88',8);line([[55,77],[89,77]],'#665d4e');line([[905,77],[905,105]],'#3a4149');label('Ti',866,61,1,'#b9b2a4',10);c.restore();
object(t);word(t);const end=ease((t-4.1)/.65);c.save();c.globalAlpha=end;label('F I R S T   L I G H T',346,337,1.7,'#a99d87',9);line([[229,377],[731,377]],'#282a2b',.65);label('FORM.  TIMING.  INTENT.',229,402,1.6,'#787f87',8);label('STUDY 001',646,402,1.6,'#787f87',8);c.restore();};
const reduced=matchMedia('(prefers-reduced-motion: reduce)');let raf=0,epoch=null;const isRender=new URLSearchParams(location.search).get('render')==='1';function tick(now){if(epoch===null)epoch=now;const t=Math.min(6,(now-epoch)/1000);window.renderFrame(t);if(t<6&&!reduced.matches)raf=requestAnimationFrame(tick)}function preview(){cancelAnimationFrame(raf);epoch=null;if(isRender){window.renderFrame(0);return}if(reduced.matches)window.renderFrame(6);else raf=requestAnimationFrame(tick)}reduced.addEventListener('change',preview);preview();
</script></body></html>
