<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bending Light · X Motion Prism</title>
<link rel="stylesheet" href="../reel/reel.css">
</head><body>
<script src="../orbit/kit.js"></script>
<script src="../reel/reel.js"></script>
<script>
'use strict';
// Bending Light. A sixty-second narrated film cut from Dispersion, Caustics and Lens: white light splits
// in a prism, water gathers it into lines, a glass sphere focuses it. Shots cross through a refracting
// diagonal wipe whose edge splits colour like the prism it follows. Original score.
// Render: node scripts/render.mjs examples/prism/bending-light.html --root examples --out renders/bending-light --video
const { lin, smooth } = Reel;
const D = 60;

const shots = [
  { id: 'dispersion', scene: 'dispersion', keys: [[0, 0], [5.6, 0.8], [11.0, 3.85], [13.0, 4.2], [21.0, 7.6], [23.0, 8.05]] },
  { id: 'caustics', scene: 'caustics', kind: 1, keys: [[21.0, 0], [29.0, 2.25], [30.0, 3.2], [36.0, 7.4], [41.0, 9.0]] },
  { id: 'lens', scene: 'lens', kind: 1, keys: [[39.0, 0], [44.0, 3.4], [48.5, 6.6], [60.0, 8.2]] },
];

const COMPOSITE = `
uniform float uFade;
const vec3 PAPER = vec3(0.888, 0.863, 0.815);
vec3 spectrum(float x){ return clamp(vec3(1.5 - abs(4.*x - 3.), 1.5 - abs(4.*x - 2.), 1.5 - abs(4.*x - 1.)), 0., 1.); }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 col;
  if (uShots < 1.5) col = A(uv);
  else {
    // a sheet of glass slides diagonally across the frame: the incoming shot is seen through it,
    // displaced and split into colour along the moving edge
    vec2 dir = normalize(vec2(1.0, 0.62));
    vec2 q = (uv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
    float d = dot(q, dir);
    float edge = mix(-1.25, 1.25, smoothstep(0., 1., uP));
    float x = (d - edge) / 0.16;
    float mB = 1. - smoothstep(-1., 1., x);
    float band = exp(-x * x * 1.2);
    vec2 off = dir * vec2(uRes.y / uRes.x, 1.0) * band * 0.045 * x;
    vec3 a = vec3(A(uv + off * 0.85).r, A(uv + off).g, A(uv + off * 1.18).b);
    vec3 b = vec3(B(uv - off * 0.85).r, B(uv - off).g, B(uv - off * 1.18).b);
    col = mix(a, b, mB);
    col += spectrum(clamp(0.5 + x * 0.35, 0., 1.)) * band * 0.10;   // the thin rainbow the edge throws
  }
  outColor = finish(mix(PAPER, col, uFade));
}`;

const uniforms = t => ({ uFade: smooth(lin(t, 0, 0.6)) * (1 - smooth(lin(t, 58.4, 59.85))) });

const cards = [
  { className: 'ink', html: '<div class="kicker">X Motion · Prism</div><div class="title">Bending Light</div>', at: [0.6, 1.8, 3.3, 4.3], rise: 14, lift: 8, blur: 6, track: [0.02, -0.03] },
  { className: 'ink low', html: '<div class="title">Bending Light</div><div class="sub">Dispersion · Caustics · Lens</div>', at: [55.2, 56.4, 58.6, 59.6], rise: 12, blur: 5, track: [0.03, -0.025] },
];

// ------------------------------------------------------------------ score + sound
// A Lydian for the prism (open, unresolved light), F-sharp minor for the water, A major for the lens.
// Glass is struck, not swept: sine partials at inharmonic ratios, tuned to the key of each section.
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
async function score(S, FX, R) {
  const room = S.reverb(5.5, 31, { decay: 4.4, dark: 0.45 }, 0.55);
  const fxRoom = FX.reverb(2.6, 37, { decay: 1.9, dark: 0.4 }, 0.42);
  const at = R.at;
  const glass = [[1, 1, 1.6], [2.32, 0.42, 0.9], [4.25, 0.2, 0.45], [6.63, 0.08, 0.22]];
  const drop = at('caustics', 3.2), stop = at('lens', 6.6);

  const sec = (notes, t0, t1, peak, cut, rise = 3, fall = 3) => S.pad({
    notes: notes.map(hz), amp: peak, send: room, sendAmt: 0.75, voices: 3, detune: 5, q: 0.4,
    env: [[t0, 0], [t0 + rise, 1], [t1 - fall, 1], [t1, 0]], cutoff: cut,
  });
  sec([45, 52, 59, 63, 68], 1.0, 23.0, 0.05, [[1, 400], [11, 1800], [23, 900]], 4.5, 2.5);
  sec([42, 49, 57, 61, 64], 20.5, 41.0, 0.05, [[20.5, 500], [drop, 1300], [drop + 0.3, 600], [36, 1400], [41, 700]], 2.5, 2.5);
  sec([45, 52, 61, 64, 69], 39.0, 60.0, 0.055, [[39, 600], [stop, 2000], [60, 1000]], 3, 2.5);

  // spectrum: one sine per colour joining as the fan opens, red lowest
  const fan0 = at('dispersion', 3.0);
  [57, 61, 64, 66, 68, 71, 73].forEach((m, i) => {
    const t0 = fan0 + i * 0.16, g = S.ctx.createGain();
    S.curve(g.gain, [[t0, 0], [t0 + 1.4, 0.012], [21.5, 0.010], [23.5, 0]]);
    g.connect(S.panner((i - 3) / 4, room)); g.connect(S.panner((i - 3) / 4, S.master));
    S.osc('sine', hz(m + 12), t0, 23.6, g);
  });
  // water: a slow arpeggio of glass notes, rippling, a beat apart (paused for the drop)
  const arp = [66, 69, 73, 76, 73, 69, 71, 73];
  for (let i = 0, t = 22.2; t < 40.5; i++, t += 0.95) {
    if (Math.abs(t - drop) < 1.6) continue;
    S.bell({ t, f: hz(arp[i % arp.length]), amp: 0.026, pan: Math.sin(i * 1.3) * 0.6, partials: glass, send: room, sendAmt: 0.9 });
  }
  // lens: the motif resolves; last chord under the title
  [[stop, 81, 0.05], [stop + 0.42, 76, 0.035], [51.2, 69, 0.03], [53.0, 73, 0.03], [55.4, 76, 0.045], [55.9, 81, 0.04], [56.5, 69, 0.045]]
    .forEach(([t, m, a], i) => S.bell({ t, f: hz(m), amp: a, pan: (i % 3 - 1) * 0.35, partials: glass, send: room, sendAmt: 0.85 }));

  // ---- sound effects
  // the beam: a faint air-hiss ignites, travels left to right, and strikes the prism with a glass tick
  const on = at('dispersion', 0.8), hit = at('dispersion', 2.35);
  FX.noise({ t0: on - 0.1, t1: 22.6, seed: 41, type: 'bandpass', freq: [[on, 6000]], q: 0.6, gain: [[on - 0.1, 0], [on + 0.4, 0.035], [21, 0.03], [22.6, 0]], pan: [[on, -0.7], [hit, -0.1]] });
  FX.bell({ t: on, f: hz(93), amp: 0.03, partials: glass, send: fxRoom });
  FX.bell({ t: hit, f: hz(88), amp: 0.06, pan: -0.15, partials: glass, send: fxRoom, sendAmt: 0.7 });
  // the prism turns: the fan sweeps the floor
  const r0 = at('dispersion', 4.2), r1 = at('dispersion', 7.6);
  FX.noise({ t0: r0, t1: r1, seed: 43, color: 'pink', type: 'bandpass', freq: [[r0, 1800], [r1, 3600]], q: 1.4, gain: [[r0, 0], [r0 + 2, 0.05], [r1 - 2, 0.05], [r1, 0]], pan: [[r0, 0.2], [r1, 0.6]] });
  // each transition: a sheet of glass slides past, close and bright
  for (const [t0, t1, s] of [[21.0, 23.0, 47], [39.0, 41.0, 53]]) {
    FX.noise({ t0: t0 - 0.2, t1: t1 + 0.4, seed: s, color: 'pink', type: 'bandpass', freq: [[t0 - 0.2, 1500], [t1, 5200], [t1 + 0.4, 3000]], q: 2.2, gain: [[t0 - 0.2, 0], [(t0 + t1) / 2, 0.12], [t1 + 0.4, 0]], pan: [[t0, -0.7], [t1, 0.7]], send: fxRoom });
    FX.bell({ t: (t0 + t1) / 2, f: hz(t0 < 30 ? 85 : 88), amp: 0.025, partials: glass, send: fxRoom, sendAmt: 0.9 });
  }
  // water bed under caustics
  FX.noise({ t0: 20.8, t1: 41.6, seed: 59, color: 'pink', type: 'lowpass', freq: [[20.8, 900], [41.6, 900]], q: 0.5, gain: [[20.8, 0], [23, 0.07], [39.5, 0.07], [41.6, 0]] });
  // the drop: a falling whistle, the impact, the splash, and the rings ringing out
  const fall = at('caustics', 2.25);
  const whistle = FX.ctx.createGain(); FX.curve(whistle.gain, [[fall, 0], [fall + 0.4, 0.02], [drop, 0.028], [drop + 0.02, 0]]); whistle.connect(FX.master);
  const wo = FX.osc('sine', hz(96), fall, drop + 0.05, whistle); FX.automate(wo.frequency, [[fall, hz(96)], [drop, hz(86), 'e']]);
  const plop = FX.ctx.createGain(); FX.curve(plop.gain, [[drop, 0], [drop + 0.006, 0.4], [drop + 0.35, 0]]); plop.connect(FX.master); plop.connect(fxRoom);
  const po = FX.osc('sine', 330, drop, drop + 0.4, plop); FX.automate(po.frequency, [[drop, 330], [drop + 0.12, 140, 'e']]);
  FX.noise({ t0: drop, t1: drop + 0.9, seed: 61, type: 'highpass', freq: [[drop, 2500], [drop + 0.9, 5000]], q: 0.6, gain: [[drop, 0], [drop + 0.01, 0.2], [drop + 0.9, 0]], send: fxRoom });
  [0, 0.42, 0.95, 1.6].forEach((dt, i) => FX.bell({ t: drop + dt, f: hz([78, 73, 69, 66][i]), amp: 0.06 * Math.pow(0.7, i), pan: (i - 1.5) * 0.25, partials: glass, send: room, sendAmt: 0.9 }));
  // the knit: a soft swell as the pattern closes
  const knit0 = at('caustics', 6.2), knit1 = at('caustics', 8.6);
  FX.noise({ t0: knit0, t1: knit1, seed: 67, color: 'pink', type: 'bandpass', freq: [[knit0, 800], [knit1, 2400]], q: 0.9, gain: [[knit0, 0], [knit1 - 0.4, 0.06], [knit1, 0]], send: room, sendAmt: 0.5 });
  // the roll: rumble shaped by speed (constant deceleration), panning with the ball; the stop rings
  const roll0 = at('lens', 0.0);
  FX.noise({ t0: roll0, t1: stop + 0.3, seed: 71, color: 'brown', type: 'lowpass', freq: [[roll0, 700], [stop, 220]], q: 0.8, gain: [[roll0, 0], [roll0 + 0.8, 0.32], [(roll0 + stop) / 2, 0.2], [stop, 0.02], [stop + 0.3, 0]], pan: [[roll0, -0.8], [stop, 0.25]] });
  FX.bell({ t: stop, f: hz(81), amp: 0.08, pan: 0.25, partials: glass, send: fxRoom, sendAmt: 0.8 });
  // focus: a thin bright tone gathering to a point
  const fz = FX.ctx.createGain(); FX.curve(fz.gain, [[46.5, 0], [49.0, 0.012], [51.5, 0]]); fz.connect(FX.panner(0.25, fxRoom)); fz.connect(FX.master);
  FX.osc('sine', hz(100), 46.5, 51.6, fz);
}

Reel.film({
  duration: D, poster: 14.0,
  scenes: { dispersion: 'dispersion.html', caustics: 'caustics.html', lens: 'lens.html' },
  shots, composite: COMPOSITE, uniforms, cards,
  fonts: ['300 112px Geist', '500 22px Geist', '400 26px Geist', '350 64px Geist'],
  voice: { audio: 'voice/bending-light.flac', cues: 'voice/bending-light.cues.json' },
  mix: { musicDuckDb: -8, fxDuckDb: -4, roomWet: 0.08 },
  score,
});
</script>
</body></html>
