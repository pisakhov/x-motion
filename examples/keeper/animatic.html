<title>Keeper · animatic · X Motion</title>
<style>
@font-face { font-family: Geist; src: url(../reel/fonts/geist.woff2) format("woff2"); font-weight: 100 900; font-display: block; }

</style>
</head><body>
<script src="../orbit/kit.js"></script>
<script src="../reel/reel.js"></script>
<script>
'use strict';
// Keeper, ANIMATIC. A 2:45 timing test of the approved outline: rough canvas sketches in motion, the real
// narration track and a scratch score. Not the film: no final art, lighting or sound design.
// A lighthouse keeper's lamp goes out the night someone is lost at sea; one match and the lens relight it.
// Render: node scripts/render.mjs examples/keeper/animatic.html --root examples --out renders/keeper-animatic --video
const K = window.OrbitKit, { clamp, lin, smooth, smoother, mix } = K;
const D = 165, S = 1.5, W = 640, H = 360;          // drawn in 640x360 sketch units, output 960x540
const RENDER = new URLSearchParams(location.search).get('render') === '1';
const PI = Math.PI, TAU = PI * 2;

// ------------------------------------------------------------------ timeline
const FLASH = [9, 22, 37, 52, 66, 106, 120, 134];   // the light's signature: three flashes, from each time
const ANSWER = [141];                               // the boat answers
const LAST = [157];                                 // one light on the night side
const BLACK = [72, 76];
const RING0 = 100, RING_STEP = 0.9, RINGS = 9;      // the lens catches the flame, ring by ring
const BEATS = [
  [0, 'Prologue', 'Streaming'], [8, 'Prologue', 'One point'],
  [14, 'I · The Fog', 'The rock'], [26, 'I · The Fog', 'The glass'], [40, 'I · The Fog', 'Someone out there'],
  [58, 'II · The Dark', 'Storm'], [72, 'II · The Dark', 'Out'], [84, 'II · The Dark', 'One match'], [98, 'II · The Dark', 'The glass gathers it'],
  [112, 'III · Found', 'Ride the beam'], [128, 'III · Found', 'Focus'], [140, 'III · Found', 'The answer'], [152, 'III · Found', 'One of many'],
];
const pulse = a => a < 0 ? 0 : a < 0.12 ? a / 0.12 : Math.exp(-(a - 0.12) / 0.45);
const sig = (t, groups, offs = [0, 1.1, 2.2]) => { let m = 0; for (const g of groups) for (const o of offs) m = Math.max(m, pulse(t - g - o)); return m; };
const ANSWER_OFFS = [0, 1.2, 2.25];                 // a hand-held lantern: not quite even

// ------------------------------------------------------------------ canvas kit
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function layer(attach) { const cv = document.createElement('canvas'); cv.width = W * S; cv.height = H * S; if (attach) document.body.appendChild(cv); return { cv, c: cv.getContext('2d') }; }
const MAIN = layer(true), LA = layer(), LB = layer(), SC = layer();
// Draw fn on a scratch layer under c's transform, then composite it once through a blur.
function blurred(c, px, fn, comp = 'source-over', alpha = 1) {
  const s = SC.c; s.setTransform(1, 0, 0, 1, 0, 0); s.clearRect(0, 0, W * S, H * S); s.setTransform(c.getTransform());
  s.globalAlpha = 1; s.globalCompositeOperation = 'source-over'; s.filter = 'none'; fn(s);
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.filter = px > 0.05 ? `blur(${(px * S).toFixed(2)}px)` : 'none';
  c.globalCompositeOperation = comp; c.globalAlpha = alpha; c.drawImage(SC.cv, 0, 0); c.restore();
}
function cam(c, cx, cy, z, dx = 0, dy = 0) { c.translate(cx + dx, cy + dy); c.scale(z, z); c.translate(-cx, -cy); }
function sky(c, top, bot, hy = H) { const g = c.createLinearGradient(0, 0, 0, hy); g.addColorStop(0, top); g.addColorStop(1, bot); c.fillStyle = g; c.fillRect(-40, -40, W + 80, hy + 40); }
function stars(c, seed, n, maxY, a, t) { const r = rng(seed); for (let i = 0; i < n; i++) { const b = r(), x = r() * W, y = r() * maxY, ph = r() * TAU, sp = 0.5 + r() * 1.5; c.fillStyle = `rgba(235,238,250,${a * (0.15 + b * 0.8) * (0.75 + 0.25 * Math.sin(t * sp + ph))})`; const d = b > 0.93 ? 1.6 : 0.9; c.fillRect(x, y, d, d); } }
function sea(c, hy, seed, t, { col = '#05080e', waves = 60, wa = 0.12, swell = 0 } = {}) {
  const g = c.createLinearGradient(0, hy, 0, H); g.addColorStop(0, '#0b1320'); g.addColorStop(1, col); c.fillStyle = g; c.fillRect(-40, hy, W + 80, H - hy + 40);
  const r = rng(seed); c.save(); c.lineCap = 'round';
  for (let i = 0; i < waves; i++) {
    const k = Math.pow(r(), 1.6), x0 = r() * W * 1.3, ph = r() * TAU, sp = 0.6 + r() * 0.6;
    const y = hy + k * (H - hy) + Math.sin(t * sp + ph) * (0.6 + k * 2.4) * (1 + swell * 3), len = 8 + k * 60;
    const x = (x0 + t * (3 + k * 16) * (1 + swell * 2)) % (W * 1.3) - W * 0.15;
    c.strokeStyle = `rgba(190,205,225,${wa * (0.3 + k) * (0.65 + 0.35 * Math.sin(t * 0.9 + ph))})`; c.lineWidth = 0.6 + k * 1.4;
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + len / 2, y - 1.5 - k * 3 * (1 + swell * 2), x + len, y); c.stroke();
  }
  c.restore();
}
function fog(c, seed, n, y0, y1, a, blur, t, drift = 5, col = '220,212,196') {
  blurred(c, blur, s => { const r = rng(seed); for (let i = 0; i < n; i++) {
    const x0 = r() * W * 1.5, y = mix(y0, y1, r()), rx = 70 + r() * 180, ry = 8 + r() * 26, al = a * (0.5 + r() * 0.5), sp = 0.4 + r(), ph = r() * TAU;
    const x = (x0 + t * drift * sp) % (W * 1.5) - W * 0.25;
    s.fillStyle = `rgba(${col},${al * (0.8 + 0.2 * Math.sin(t * 0.3 + ph))})`; s.beginPath(); s.ellipse(x, y, rx, ry, 0, 0, TAU); s.fill(); } });
}
function glow(c, x, y, rad, rgb, a) { if (a <= 0 || rad <= 0) return; c.save(); c.globalCompositeOperation = 'lighter'; const g = c.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, `rgba(${rgb},${Math.min(1, a)})`); g.addColorStop(0.35, `rgba(${rgb},${Math.min(1, a) * 0.35})`); g.addColorStop(1, `rgba(${rgb},0)`); c.fillStyle = g; c.fillRect(x - rad, y - rad, rad * 2, rad * 2); c.restore(); }
function beam(c, ox, oy, ang, len, spread, a, blur = 4, rgb = '255,246,226') {
  if (a <= 0.003) return;
  blurred(c, blur, s => { const ex = ox + Math.cos(ang) * len, ey = oy + Math.sin(ang) * len;
    const g = s.createLinearGradient(ox, oy, ex, ey); g.addColorStop(0, `rgba(${rgb},${Math.min(1, a)})`); g.addColorStop(0.6, `rgba(${rgb},${Math.min(1, a) * 0.3})`); g.addColorStop(1, `rgba(${rgb},0)`);
    s.fillStyle = g; s.beginPath(); s.moveTo(ox, oy - 2); s.lineTo(ox + Math.cos(ang - spread) * len, oy + Math.sin(ang - spread) * len); s.lineTo(ox + Math.cos(ang + spread) * len, oy + Math.sin(ang + spread) * len); s.lineTo(ox, oy + 2); s.fill(); }, 'lighter');
}
function rock(c, x, base, w, seed) { const r = rng(seed); c.fillStyle = '#030508'; c.beginPath(); c.moveTo(x - w, H + 40); c.lineTo(x - w, base + 14); for (let i = 0; i <= 10; i++) c.lineTo(mix(x - w, x + w, i / 10), base - Math.sin(i / 10 * PI) * 18 + r() * 8); c.lineTo(x + w, H + 40); c.fill(); }
function lighthouse(c, x, base, h, lit = 1) {
  const bw = h * 0.17, tw = h * 0.105, top = base - h;
  c.fillStyle = '#0a0f17'; c.beginPath(); c.moveTo(x - bw / 2, base); c.lineTo(x - tw / 2, top + h * 0.14); c.lineTo(x + tw / 2, top + h * 0.14); c.lineTo(x + bw / 2, base); c.fill();
  c.fillStyle = 'rgba(160,175,195,.07)'; c.beginPath(); c.moveTo(x + bw * 0.15, base); c.lineTo(x + tw * 0.12, top + h * 0.14); c.lineTo(x + tw / 2, top + h * 0.14); c.lineTo(x + bw / 2, base); c.fill();
  c.fillStyle = '#0a0f17'; c.fillRect(x - tw * 0.75, top + h * 0.12, tw * 1.5, h * 0.03);
  const l = clamp(lit); c.fillStyle = `rgb(${mix(20, 255, l) | 0},${mix(26, 207, l) | 0},${mix(34, 134, l) | 0})`; c.fillRect(x - tw * 0.4, top + h * 0.03, tw * 0.8, h * 0.09);
  c.fillStyle = '#0a0f17'; c.fillRect(x - tw * 0.06, top + h * 0.03, tw * 0.12, h * 0.09);
  c.beginPath(); c.moveTo(x - tw * 0.55, top + h * 0.035); c.lineTo(x, top - h * 0.03); c.lineTo(x + tw * 0.55, top + h * 0.035); c.fill();
  glow(c, x, top + h * 0.075, h * 0.5 * (0.5 + 0.5 * lit), '255,190,110', 0.55 * lit);
  return [x, top + h * 0.075];
}
function boatShape(c, x, y, s, tilt = 0) {
  c.save(); c.translate(x, y); c.rotate(tilt); c.fillStyle = '#020306';
  c.beginPath(); c.moveTo(-22 * s, 0); c.lineTo(24 * s, 0); c.lineTo(17 * s, 7 * s); c.lineTo(-17 * s, 7 * s); c.fill();
  c.fillRect(-1 * s, -34 * s, 1.6 * s, 34 * s);
  c.beginPath(); c.moveTo(-6 * s, -2 * s); c.lineTo(-6 * s, -14 * s); c.quadraticCurveTo(-3 * s, -18 * s, -1 * s, -15 * s); c.lineTo(-1 * s, -2 * s); c.fill();
  c.beginPath(); c.arc(-3.5 * s, -17 * s, 2.6 * s, 0, TAU); c.fill(); c.restore();
}
// A boat with its lantern. blur in sketch px (0 = the one perfect focus); lift raises the lantern.
function boat(c, x, y, s, blur, light, tilt = 0, lift = 0) {
  blurred(c, blur, k => boatShape(k, x, y, s, tilt));
  const lx = x + 12 * s, ly = y - (10 + lift) * s, soft = clamp(blur / 3.2);
  glow(c, lx, ly, mix(26, 40, soft) * s * (0.6 + 0.4 * light), '255,176,80', 0.9 * light);
  c.fillStyle = `rgba(255,224,170,${clamp(light)})`; c.beginPath(); c.arc(lx, ly, mix(1.8, 2.6, soft) * s, 0, TAU); c.fill();
  return [lx, ly];
}
function rain(c, seed, n, ang, a, len, t, speed = 520) {
  if (a <= 0 || n <= 0) return; const r = rng(seed); c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
  const dx = Math.cos(ang), dy = Math.sin(ang);
  for (let i = 0; i < n; i++) { const x0 = r() * (W + 300), y0 = r() * (H + 80), l = len * (0.5 + r()), al = a * (0.3 + r() * 0.7), lw = 0.5 + r() * 0.9, sp = speed * (0.7 + r() * 0.6);
    const y = (y0 + t * sp * dy) % (H + 80) - 40, x = ((x0 + t * sp * dx) % (W + 300) + W + 300) % (W + 300) - 150;
    c.strokeStyle = `rgba(200,215,235,${al})`; c.lineWidth = lw; c.beginPath(); c.moveTo(x, y); c.lineTo(x + dx * l, y + dy * l); c.stroke(); }
  c.restore();
}
// The streaming blur: horizontal streaks of light that can gather toward one point.
function streaks(c, seed, n, blur, t, converge, cx, cy, a = 1) {
  if (a <= 0) return;
  blurred(c, blur, s => { const r = rng(seed); s.lineCap = 'round';
    for (let i = 0; i < n; i++) { const y0 = r() * H, cv = 0.5 + r() * 0.5, x0 = r() * W * 1.6, l0 = 60 + r() * 260, warm = r() < 0.3, al = (0.15 + r() * 0.5) * a, lw = 1 + r() * 5, sp = 14 + r() * 46;
      const k = clamp(converge * (0.55 + cv * 0.9)), y = mix(y0, cy, k), l = l0 * (1 - k * 0.92);
      const x = mix((x0 + t * sp) % (W * 1.6) - W * 0.3, cx - l / 2, k);
      const rgb = warm ? '255,190,120' : '190,210,240', g = s.createLinearGradient(x, y, x + l, y);
      g.addColorStop(0, `rgba(${rgb},0)`); g.addColorStop(0.5, `rgba(${rgb},${al * (1 - k * 0.6)})`); g.addColorStop(1, `rgba(${rgb},0)`);
      s.strokeStyle = g; s.lineWidth = lw * (1 - k * 0.6); s.beginPath(); s.moveTo(x, y); s.lineTo(x + l + 0.01, y); s.stroke(); } }, 'lighter');
}
function vignette(c, a = 0.65) { const g = c.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, W * 0.65); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); c.save(); c.setTransform(S, 0, 0, S, 0, 0); c.fillStyle = g; c.fillRect(0, 0, W, H); c.restore(); }
// The Fresnel lens seen head-on. lit(i) in 0..1 for ring i (1 = innermost); a highlight turns with the clockwork.
function lens(c, cx, cy, R, lit, spectral, t, seed, turn = 1) {
  c.fillStyle = '#07090c'; c.fillRect(-40, -40, W + 80, H + 80);
  c.strokeStyle = 'rgba(160,120,60,.35)'; c.lineWidth = 2; for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(cx + i * R * 0.55, -40); c.lineTo(cx + i * R * 0.55, H + 40); c.stroke(); }
  let total = 0;
  for (let i = RINGS; i >= 1; i--) {
    const rr = R * i / RINGS, on = clamp(lit(i)); total += on / RINGS;
    const g = c.createRadialGradient(cx, cy, rr * 0.82, cx, cy, rr);
    g.addColorStop(0, 'rgba(30,40,52,.6)');
    g.addColorStop(0.75, `rgba(${mix(120, 255, on) | 0},${mix(140, 214, on) | 0},${mix(165, 150, on) | 0},${0.14 + on * 0.5})`);
    g.addColorStop(1, 'rgba(10,14,20,.9)');
    c.fillStyle = g; c.beginPath(); c.arc(cx, cy, rr, 0, TAU); c.fill();
    const a0 = t * 0.35 * turn + i * 0.7; c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
    c.strokeStyle = `rgba(255,236,200,${0.05 + on * 0.3})`; c.lineWidth = 1.6; c.beginPath(); c.arc(cx, cy, rr - 2, a0, a0 + 0.9); c.stroke();
    c.beginPath(); c.arc(cx, cy, rr - 2, a0 + PI, a0 + PI + 0.5); c.stroke();
    if (spectral > 0 && on > 0.5) { c.strokeStyle = `hsla(${(i * 37) % 360},90%,70%,${0.35 * spectral})`; c.lineWidth = 1.2; c.beginPath(); c.arc(cx, cy, rr - 1, 0, TAU); c.stroke(); }
    c.restore();
  }
  glow(c, cx, cy, R * (0.5 + total * 1.4), '255,200,130', total > 0 ? 0.25 + total * 0.5 : 0);
  if (total > 0.2) { const r = rng(seed); c.save(); c.globalCompositeOperation = 'lighter'; c.lineWidth = 1;
    for (let i = 0; i < 28; i++) { const x0 = r() * W, y0 = r() * H, al = (0.05 + r() * 0.12) * total, ph = r() * TAU, x = x0 + Math.sin(t * 0.5 + ph) * 14, y = y0 + Math.cos(t * 0.4 + ph) * 9;
      c.strokeStyle = `rgba(255,220,170,${al * (0.6 + 0.4 * Math.sin(t * 1.3 + ph))})`; c.beginPath(); c.moveTo(x, y); c.bezierCurveTo(x + 20, y - 10, x + 30, y + 14, x + 52, y + 2); c.stroke(); }
    c.restore(); }
  return total;
}
function flame(c, x, y, s, t, a = 1) {
  const fl = 1 + 0.07 * Math.sin(t * 11) + 0.05 * Math.sin(t * 17.3 + 1) + 0.04 * Math.sin(t * 5.1), lean = Math.sin(t * 3.1) * 1.5 * s;
  glow(c, x, y - 4 * s, 80 * s * fl, '255,170,70', 0.9 * a);
  c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = a; const hgt = 20 * s * fl;
  const g = c.createLinearGradient(x, y, x, y - hgt); g.addColorStop(0, 'rgba(140,170,255,.8)'); g.addColorStop(0.3, 'rgba(255,210,140,1)'); g.addColorStop(1, 'rgba(255,150,60,0)');
  c.fillStyle = g; c.beginPath(); c.moveTo(x + lean, y - hgt); c.bezierCurveTo(x + 5 * s, y - 8 * s, x + 5 * s, y, x, y); c.bezierCurveTo(x - 5 * s, y, x - 5 * s, y - 8 * s, x + lean, y - hgt); c.fill(); c.restore();
}
function smoke(c, x, y, grow, t) {
  if (grow <= 0) return;
  blurred(c, 2.2, s => { s.lineCap = 'round';
    for (let k = 0; k < 3; k++) { const w = Math.sin(t * 0.7 + k) * 8, top = y - 24 - 126 * grow;
      s.strokeStyle = `rgba(200,195,185,${(0.22 - k * 0.05) * Math.min(1, grow * 2)})`; s.lineWidth = 3 + k * 3;
      s.beginPath(); s.moveTo(x, y - 24); s.bezierCurveTo(x + (18 + k * 6) * grow + w, mix(y - 24, y - 60, grow), x - (26 + k * 8) * grow - w, mix(y - 24, y - 90, grow), x + (10 + k * 10) * grow + w * 0.5, top); s.stroke(); } });
}
// Text is light coming into focus: every glyph rises and sharpens in a stagger.
function resolveText(c, parts, x, y, font, t, t0, stagger, dur, alpha, rgb = '246,241,228') {
  c.save(); c.font = font; c.textBaseline = 'middle';
  for (const [i, p] of parts.entries()) {
    const k = smoother(lin(t, t0 + i * stagger, t0 + i * stagger + dur)); if (k <= 0) { x += p.w; continue; }
    c.filter = k < 0.995 ? `blur(${((1 - k) * 7 * S).toFixed(2)}px)` : 'none';
    c.fillStyle = `rgba(${rgb},${alpha * k})`; c.fillText(p.s, x, y + (1 - k) * 6); x += p.w;
  }

}
function title(c, t, t0, y, size, alpha) {
  if (alpha <= 0 || t < t0) return;
  c.save(); c.font = `250 ${size}px Geist`; const sp = size * 0.32;
  const parts = [...'KEEPER'].map(s => ({ s, w: c.measureText(s).width + sp })); c.restore();
  const total = parts.reduce((a, p) => a + p.w, 0) - sp;
  resolveText(c, parts, W / 2 - total / 2, y, `250 ${size}px Geist`, t, t0, 0.22, 1.3, alpha);
}

// ------------------------------------------------------------------ scenes
const lamp = t => sig(t, FLASH);
const SCENES = [
  // Prologue: the streaming blur gathers into one far light, which signs its name.
  { t0: 0, t1: 14.8, fn(c, t) {
    c.fillStyle = '#010204'; c.fillRect(0, 0, W, H);
    const k = smoother(lin(t, 7.2, 10.6)), a = smooth(lin(t, 0.3, 2.6)), cx = W / 2, cy = 150;
    streaks(c, 3, 46, 7, t, k, cx, cy, a * (1 - 0.8 * smooth(lin(t, 10, 13))));
    streaks(c, 4, 20, 2.5, t * 1.4, k, cx, cy, a * (1 - smooth(lin(t, 9, 11.5))));
    const p = smooth(lin(t, 8.2, 9)), f = lamp(t);
    glow(c, cx, cy, 40 + 50 * f, '255,190,110', p * (0.3 + 0.7 * f)); glow(c, cx, cy, 6 + 8 * f, '255,240,220', p * (0.55 + 0.45 * f));
    title(c, t, 10.6, 268, 46, 1 - smooth(lin(t, 13.6, 14.6)));
    vignette(c, 0.75); } },
  // The rock: her world. The beam sweeps the fog and flashes its three.
  { t0: 13.6, t1: 26.8, fn(c, t) {
    const u = lin(t, 13.6, 26.8), f = lamp(t); c.save(); cam(c, 470, 200, 1 + 0.07 * u);
    sky(c, '#060a12', '#1a2433', 230); stars(c, 11, 50, 160, 0.35, t); sea(c, 230, 12, t); fog(c, 13, 18, 170, 250, 0.16, 14, t, 4);
    const [lx, ly] = lighthouse(c, 470, 248, 150, 0.45 + 0.55 * f); rock(c, 470, 252, 90, 14);
    const ang = PI * 1.04 + 0.11 * Math.sin((t - 14) * 0.32);
    beam(c, lx, ly, ang, 520, 0.07, 0.2 + 0.5 * f, 6); beam(c, lx, ly, ang, 420, 0.02, 0.2 + 0.5 * f, 1.5);
    fog(c, 15, 14, 210, 320, 0.13, 18, t, 7); c.restore(); vignette(c); } },
  // The glass: the lens turns; her hand winds the clockwork.
  { t0: 26, t1: 40.2, fn(c, t) {
    const u = lin(t, 26, 40.2), f = lamp(t); c.save(); cam(c, W / 2, H / 2, 1 + 0.06 * u);
    lens(c, W / 2, H / 2, 160, i => 0.52 + 0.1 * Math.sin(t * 1.1 + i) + 0.4 * f, 0, t, 17);
    const a = t * 2.1, kx = 548 + Math.cos(a) * 16, ky = 300 + Math.sin(a) * 16;   // crank and the winding hand
    c.strokeStyle = 'rgba(160,120,60,.6)'; c.lineWidth = 3; c.beginPath(); c.arc(548, 300, 16, 0, TAU); c.stroke();
    c.strokeStyle = 'rgba(190,150,80,.8)'; c.beginPath(); c.moveTo(548, 300); c.lineTo(kx, ky); c.stroke();
    c.fillStyle = '#000'; c.beginPath(); c.ellipse(kx + 8, ky + 8, 15, 11, -0.5, 0, TAU); c.fill();
    c.beginPath(); c.moveTo(kx - 4, ky + 12); c.lineTo(kx + 20, ky - 2); c.lineTo(W + 60, H - 20); c.lineTo(W + 60, H + 60); c.lineTo(W - 70, H + 60); c.fill();
    c.restore(); vignette(c, 0.7); } },
  // Someone out there: a lantern in the fog that will not come into focus.

  const ctx = new OfflineAudioContext(2, Math.ceil(D * sampleRate), sampleRate);
  const voiceBuf = await ctx.decodeAudioData(voiceBytes.slice(0));
  await K.deterministicGraph(ctx, async () => {
    const music = ctx.createGain(), fx = ctx.createGain(), voice = ctx.createGain();
    music.connect(ctx.destination); fx.connect(ctx.destination); voice.connect(ctx.destination);
    const C = K.studio(ctx, D, ctx.createGain());
    C.curve(music.gain, Reel.duckPoints(cues.lines, D, { depthDb: -8 })); C.curve(fx.gain, Reel.duckPoints(cues.lines, D, { depthDb: -5 }));
    const M = K.studio(ctx, D, music), FX = K.studio(ctx, D, fx), V = K.studio(ctx, D, voice);
    const src = ctx.createBufferSource(); src.buffer = voiceBuf;
    const g = ctx.createGain(), room = V.reverb(1.6, 977, { decay: 1.1, dark: 0.7 }, 0.1), centre = ctx.createStereoPanner();
    src.connect(g); g.connect(centre); centre.connect(V.master); g.connect(room); src.start(0);
    await score(M, FX);
  });
  return K.finalize(await ctx.startRendering(), -18, -1.7, D);
}

window.motion = { width: W * S, height: H * S, duration: D, fps: 30, poster: 131.5 };
window.renderFrame = renderFrame;
window.renderAudio = async ({ sampleRate = 48000 } = {}) => mixdown(sampleRate);

// Browser preview: real time, frames may drop. Click to play with sound from the start; click again to stop.
if (!RENDER) {
  let audio = null, t0 = performance.now(), busy = false;
  document.body.style.cursor = 'pointer'; document.body.title = 'Click to play with sound';
  document.addEventListener('click', async () => {
    if (audio) { audio.ac.close(); audio = null; t0 = performance.now(); return; }
    const ac = new AudioContext(), buf = await window.renderAudio({ sampleRate: ac.sampleRate });
    const src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
    const start = ac.currentTime + 0.05; src.start(start); src.loop = true; audio = { ac, start };
  });
  const loop = async () => {
    if (!busy) { busy = true; const t = audio ? ((audio.ac.currentTime - audio.start) % D + D) % D : ((performance.now() - t0) / 1000) % D;
      try { await renderFrame(t); } finally { busy = false; } }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
