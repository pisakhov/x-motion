map "$status:$uri" $motion_cache {
    default 'no-cache';
    ~^[45] 'no-store';
    ~^(200|206|304):/media/ 'public, max-age=31536000, immutable';
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header Cache-Control $motion_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
    location / { try_files $uri $uri/ =404; }
    location /media/ { try_files $uri =404; }
}
