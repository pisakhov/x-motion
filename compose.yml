services:
  gallery:
    build:
      context: .
    restart: unless-stopped
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m

# Dokploy's existing attachable network; no extra per-app subnet allocation.
networks:
  default:
    external: true
    name: dokploy-network
